<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>QuantumDomo PASC</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- PWA -->
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />

  <!-- Manifest inline -->
  <link rel="manifest" href="data:application/json,{
    &quot;name&quot;:&quot;QuantumDomo PASC&quot;,
    &quot;short_name&quot;:&quot;QuantumDomo&quot;,
    &quot;start_url&quot;:&quot;.&quot;,
    &quot;display&quot;:&quot;standalone&quot;,
    &quot;background_color&quot;:&quot;#0a0a0a&quot;,
    &quot;theme_color&quot;:&quot;#0a0a0a&quot;
  }">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    #loader {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
      color: #00ffff;
      font-family: system-ui, sans-serif;
      z-index: 9999;
    }
  </style>
</head>

<body>

  <div id="loader">Cargando QuantumDomo…</div>

  <iframe
    src="https://codexpromptusiuris.github.io/vibecodingchile.github.io/"
    onload="document.getElementById('loader').style.display='none';">
  </iframe>

  <script>
    if ("serviceWorker" in navigator) {
      const swCode = `
        const CACHE = 'quantumdomo-pwa-v1';
        self.addEventListener('install', e => {
          e.waitUntil(
            caches.open(CACHE).then(c => c.addAll(['./']))
          );
        });
        self.addEventListener('fetch', e => {
          e.respondWith(
            caches.match(e.request).then(r => r || fetch(e.request))
          );
        });
      `;
      const blob = new Blob([swCode], { type: "text/javascript" });
      navigator.serviceWorker.register(URL.createObjectURL(blob));
    }
  </script>

</body>
</html>

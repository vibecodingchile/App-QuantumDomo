<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuantumDomo PASC</title>

  <!-- PWA -->
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />

  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />

  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="logo">QD</div>
        <div class="brand-text">
          <h1>QuantumDomo</h1>
          <p class="subtitle">PASC • Panel de Control</p>
        </div>
      </div>

      <div class="status">
        <div class="pill" id="pwaStatus">PWA: verificando…</div>
        <div class="pill" id="onlineStatus">Red: …</div>
      </div>
    </header>

    <main class="content">
      <section class="hero">
        <div>
          <h2>Dashboard</h2>
          <p class="muted">
            GitHub Pages funcionando ✅ — ahora con UI, PWA e interacción.
          </p>
        </div>

        <div class="hero-right">
          <div class="timebox">
            <div class="time" id="clock">--:--</div>
            <div class="date" id="date">--/--/----</div>
          </div>

          <button class="btn primary" id="installBtn" hidden>Instalar App</button>
        </div>
      </section>

      <section class="grid">
        <article class="card">
          <div class="card-head">
            <h3>Casa</h3>
            <span class="tag">Modo</span>
          </div>
          <div class="big" id="modeLabel">Normal</div>
          <div class="row">
            <button class="btn" data-mode="Normal">Normal</button>
            <button class="btn" data-mode="Ahorro">Ahorro</button>
            <button class="btn" data-mode="Noche">Noche</button>
          </div>
        </article>

        <article class="card">
          <div class="card-head">
            <h3>Iluminación</h3>
            <span class="tag" id="lightsTag">OFF</span>
          </div>
          <div class="big" id="lightsLabel">Apagadas</div>
          <div class="row">
            <button class="btn primary" id="toggleLights">Toggle</button>
            <button class="btn" id="allOn">Todo ON</button>
            <button class="btn" id="allOff">Todo OFF</button>
          </div>
        </
